[project]
name = "Rosmontis"
version = "2.0.0"
description = "Rosmontis"
readme = "README.md"
requires-python = ">=3.14, <4.0"
dependencies = [
    "nonebot2[aiohttp,fastapi,httpx,websockets]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-adapter-feishu>=2.7.2",
    "nonebot-adapter-qq>=1.7.1",
    "nonebot-plugin-sentry>=2.0.0",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-localstore>=0.7.4",
    "nonebot-plugin-orm>=0.8.3",
    "nonebot-plugin-alconna>=0.62.0",
    "nonebot-plugin-htmlrender>=0.7.1",
    "nonebot-plugin-uninfo>=0.11.1",
    "nonebot-plugin-waiter>=0.8.1",
    "aiofiles>=25.1.0",
    "aiohttp[speedups]>=3.14.1",
    "aiomysql>=0.3.2",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "backoff>=2.2.1",
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "cryptography>=48.0.1",
    "e2b>=2.29.5",
    "e2b-code-interpreter>=2.8.1",
    "email-validator>=2.3.0",
    "fastapi>=0.139.2",
    "fastapi-cli>=0.0.27",
    "gradio>=5.0.0",
    "httpx[http2]>=0.28.1",
    "huggingface-hub>=1.20.1",
    "jinja2>=3.1.6",
    "kubernetes>=36.0.2",
    "loguru>=0.7.3",
    "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1.6",
    "mcp>=1.28.1",
    "nb-cli>=1.7.4",
    "onnxruntime>=1.27.0",
    "openai>=2.43.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "playwright>=1.60.0",
    "pycryptodome>=3.23.0",
    "pydantic>=2.13.4",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "pymysql>=1.2.0",
    "pysocks>=1.7.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sentry-sdk[loguru]>=2.63.0",
    "sqlalchemy>=2.0.51",
    "sse-starlette>=3.4.5",
    "tenacity>=9.1.4",
    "tokenizers>=0.23.1",
    "uvicorn[standard]>=0.49.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pyright[nodejs]",
    "ruff>=0.9.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "nonebug>=0.4.4",
    "respx>=0.23.1",
]
[tool.nonebot]
plugin_dirs = ["src/plugins"]
builtin_plugins = ["echo"]

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
"@local" = []
nonebot-adapter-feishu = [{ name = "飞书", module_name = "nonebot.adapters.feishu" }]

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-sentry = ["nonebot_plugin_sentry"]
nonebot-plugin-apscheduler = ["nonebot_plugin_apscheduler"]
nonebot-plugin-localstore = ["nonebot_plugin_localstore"]
nonebot-plugin-orm = ["nonebot_plugin_orm"]
[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# For more rules, see https://docs.astral.sh/ruff/rules/.
select = [
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "E",     # pycodestyle errors
    "I",     # isort
    "C90",   # mccabe
    "N",     # pep8-naming
    "PL",    # pylint
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    # "ERA",   # eradicate
    # "FAST",  # FastAPI
    "PERF",  # Perflint
    "PGH",   # pygrep-hooks
    "FURB",  # refurb
    "TRY",   # tryceratops
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E402",    # module-import-not-at-top-of-file  # nonebot2 require() violates this
    "B008",    # function-call-in-default-argument  # nonebot2 Depends() without Annotated violates this
    "UP037",   # quoted-annotation
    # "RUF001",  # ambiguous-unicode-character-string
    # "RUF002",  # ambiguous-unicode-character-docstring
    # "RUF003",  # ambiguous-unicode-character-comment
    # "ANN201",  # missing-return-type-undocumented-public-function
    "ANN202",  # missing-return-type-private-function
    "ANN401",  # any-type
    "COM812",  # missing-trailing-comma
    "PLC0415", # import-outside-top-level
]
allowed-confusables = ["，", "。", "“", "”", "：", "；", "？", "！", "【", "】", "《", "》", "…", "—", "（", "）", "、"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
# For Pylance/Pyright configurations, see https://microsoft.github.io/pyright/#/configuration.
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
env_files = [
    ".env.prod"
]
