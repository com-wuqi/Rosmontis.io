# Rosmontis.io Docker Compose 配置
services:
  # 机器人服务
  rosbot:
    build:
      context: .
      dockerfile: Dockerfile
    # image: ${IMAGE:-ghcr.io/com-wuqi/rosmontis.io:latest}
    container_name: rosbot
    restart: unless-stopped
    environment:
      # 从 .env.prod 加载，这里可以覆盖
      - SQLALCHEMY_DATABASE_URL=mysql+aiomysql://rosbot:${MYSQL_PASSWORD}@mysql:3306/data
      - ONEBOT_WS_URLS=["ws://snowluma:3001/onebot/v11/ws"]
      - PUBLICAPI__UPLOAD_WS_URL=ws://snowluma:3001
      - PUBLICAPI__IS_ENABLE_UPLOAD=true
      - AIHELPER__REDIS_URL=redis://redis:6379/0
      - APSCHEDULER_CONFIG={"apscheduler.jobstores":{"default":{"type":"sqlalchemy","url":"mysql+pymysql://rosbot:${MYSQL_PASSWORD}@mysql:3306/data","tablename":"apscheduler_jobs"}}}

    volumes:
      # 持久化插件数据
      - rosbot_data:/app/data
      # 挂载环境配置文件
      - ./.env.prod:/app/.env.prod
      # 挂载插件目录
      - ./src/plugins:/app/src/plugins
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      snowluma:
        condition: service_started
    networks:
      - rosbot-network


  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: rosbot-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=data
      - MYSQL_USER=rosbot
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    networks:
      - rosbot-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis
  redis:
    image: redis:8-alpine
    container_name: rosbot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 900 1 --save 300 10
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - rosbot-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  snowluma:
    image: ${SNOWLUMA_IMAGE:-motricseven7/snowluma:latest}
    container_name: snowluma
    restart: unless-stopped
    shm_size: 1gb
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      SNOWLUMA_ACCEPT_EULA: 1
      SNOWLUMA_ACCEPT_PRIVACY: 1
      VNC_PASSWD: ${VNC_PASSWD:-vncpasswd}
      SNOWLUMA_UID: ${SNOWLUMA_UID:-1000}
      SNOWLUMA_GID: ${SNOWLUMA_GID:-1000}
      SNOWLUMA_WEBUI_PORT: ${SNOWLUMA_WEBUI_PORT:-5099}
      SNOWLUMA_LOG_LEVEL: ${SNOWLUMA_LOG_LEVEL:-info}
      SNOWLUMA_SCREEN: ${SNOWLUMA_SCREEN:-1920x1080x24}
      SNOWLUMA_HOOK_AUTOLOAD: ${SNOWLUMA_HOOK_AUTOLOAD:-1}
      SNOWLUMA_EXTRA_QQ_HOMES: "${SNOWLUMA_EXTRA_QQ_HOMES:-}"
      SNOWLUMA_QQ_FLAGS: "${SNOWLUMA_QQ_FLAGS:---disable-gpu --disable-software-rasterizer --disable-gpu-compositing}"
    ports:
      - "${VNC_PORT:-5900}:5900"
      - "${NOVNC_PORT:-6081}:6081"
      - "${SNOWLUMA_WEBUI_HOST_PORT:-5099}:${SNOWLUMA_WEBUI_PORT:-5099}"
      - "${ONEBOT_HTTP_PORT:-3000}:3000"
      - "${ONEBOT_WS_PORT:-3001}:3001"
    volumes:
      - snowluma-data:/app/snowluma-data
      - snowluma-qq-config:/app/.config
      - snowluma-qq-data:/app/.local/share
    networks:
      - rosbot-network

networks:
  rosbot-network:
    driver: bridge

volumes:
  rosbot_data:
    driver: local
  mysql_data:
    driver: local
  redis_data:
    driver: local
  snowluma-data:
  snowluma-qq-config:
  snowluma-qq-data:
